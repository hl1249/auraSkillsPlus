consumable-requirements:
  alchemy:
    # Unknown or custom potion types require this level, preventing bypasses.
    default-required-level: 11
    potion-effects:
      # Alchemy levels 0-10: only Weakness and Swiftness potion families are usable.
      WEAKNESS: 0
      LONG_WEAKNESS: 0
      SWIFTNESS: 0
      LONG_SWIFTNESS: 0
      STRONG_SWIFTNESS: 0
      # All other vanilla potion types require level 11.
      WATER: 11
      AWKWARD: 11
      THICK: 11
      MUNDANE: 11
      FIRE_RESISTANCE: 11
      LONG_FIRE_RESISTANCE: 11
      HARMING: 11
      STRONG_HARMING: 11
      HEALING: 11
      STRONG_HEALING: 11
      INFESTED: 11
      INVISIBILITY: 11
      LONG_INVISIBILITY: 11
      LEAPING: 11
